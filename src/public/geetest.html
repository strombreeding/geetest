    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <style>
      body {
        margin: 0;
      }

      .title {
        height: 18px;
        margin: 15px;
        font-size: 18px;
        line-height: 18px;
      }

      #log {
        display: none;

      #geetest_index_loading {
        position: fixed;

      #captcha {

    <div id="log"></div>

    <script>
      window.document.addEventListener(
        "message",
        function (RnData) {
          window.ReactNativeWebView.postMessage(JSON.stringify(RnData));
          // message = msg.data;
        },
        false
      );
      var debug = false;
      var logEle = document.getElementById("log");
      var isOffline = false;
      var indexVersion = "1.3.1"; // 中间页版本号，每次修改文件要进行版本号升级
      function log(str) {
        if (!debug) {
          return;
        }
        var p = document.createElement("p");
        p.appendChild(document.createTextNode(str));
        logEle.insertBefore(p, logEle.firstChild);
        // 同时将错误输出到控制台
        console.log(str);
      }
      (function () {
        // 错误构造函数
        function newError(msg, code, detail) {
          return {
            desc: {
              indexVersion: indexVersion,
              detail: detail,
            },
            msg: msg,
            code: code,
          };
        }
        function uploadExtraData(type, extraData) {
          var self = window;
          // 参数应该存在length属性，并且参数长度不可超过限制
          if (!extraData || !extraData.length || extraData.length >= 1024 * 4) {
            return;
          }
          if (!self.extraData) {
            self.extraData = {};
          }
          // 设计成可拓展的结构，防止以后有类似的字段增加需求
          self.extraData[type] = extraData;
        }
        var jsBridge = (function () {
          var callbacks = {
            showBox: function () {
              captchaObj.showBox && captchaObj.showBox();
            },
            postNativeMessage: function (data) {
              log("getCore time: " + new Date().getTime());
              uploadExtraData("GeeToken", data);
              captchaObj.uploadExtraData &&
                captchaObj.uploadExtraData("GeeToken", data);
            },
          };
          var call = function (data) {
            //调用原生方法
            try {
              window.ReactNativeWebView.postMessage(JSON.stringify(data));
            } catch (e) {
              log("调用navtive接口异常");
            }
          };
          // var nativeCall = (function () {
          //     if (window.postMessage) {
          //         return window.ReactNativeWebView.postMessage.bind(window.postMessage)
          //     } else if (window.JSInterface) {
          //         return JSInterface.gt4Notify.bind(JSInterface)
          //     } else {
          //         log('请在移动端环境运行')
          //     }
          // })();

          return {
            callback: function (type, data) {
              return callbacks[type](data);
            },
            callNative: call,
          };
        })();
        // 暴露 jsBridge
        window.jsBridge = jsBridge;
        // jsBridge 与 全局全局错误捕获要尽可能早的加载，防止gt4中的错误捕获不到；
        if (window.addEventListener) {
          window.addEventListener("error", function (e) {
            jsBridge.callNative({
              type: "error",
              data: newError("gt4-index error", 60302, e.message),
            });
          });
        } else {
          window.onerror = function (e) {
            jsBridge.callNative({
              type: "error",
              data: newError("gt4-index error", 60302, e.message),
            });
          };
        }
      })();
    </script>

    <!-- 此链接位置不要改变，防止上面页面错误catch 不到gt4的错误-->
    <script>
      (function (window) {
        "use strict";
        if (typeof window === "undefined") {
          throw new Error("Geetest requires browser environment");
        }

        var document = window.document;
        var Math = window.Math;
        var head = document.getElementsByTagName("head")[0];
        var TIMEOUT = 10000;

        function _Object(obj) {
          this._obj = obj;
        }

        _Object.prototype = {
          _each: function (process) {
            var _obj = this._obj;
            for (var k in _obj) {
              if (_obj.hasOwnProperty(k)) {
                process(k, _obj[k]);
              }
            }
            return this;
          },
          _extend: function (obj) {
            var self = this;
            new _Object(obj)._each(function (key, value) {
              self._obj[key] = value;
            });
          },
        };

        var uuid = function () {
          return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(
            /[xy]/g,
            function (c) {
              var r = (Math.random() * 16) | 0;
              var v = c === "x" ? r : (r & 0x3) | 0x8;
              return v.toString(16);
            }
          );
        };

        function Config(config) {
          var self = this;
          new _Object(config)._each(function (key, value) {
            self[key] = value;
          });
        }

        Config.prototype = {
          apiServers: [
            "gcaptcha4.geetest.com",
            "gcaptcha4.geevisit.com",
            "gcaptcha4.gsensebot.com",
          ],
          staticServers: ["static.geetest.com", "static.geevisit.com"],
          protocol: "http://",
          typePath: "/load",
          fallback_config: {
            bypass: {
              staticServers: ["static.geetest.com", "static.geevisit.com"],
              type: "bypass",
              bypass: "/v4/bypass.js",
            },
          },
          _get_fallback_config: function () {
            var self = this;
            if (isString(self.type)) {
              return self.fallback_config[self.type];
            } else {
              return self.fallback_config.bypass;
            }
          },
          _extend: function (obj) {
            var self = this;
            new _Object(obj)._each(function (key, value) {
              self[key] = value;
            });
          },
        };
        var isNumber = function (value) {
          return typeof value === "number";
        };
        var isString = function (value) {
          return typeof value === "string";
        };
        var isBoolean = function (value) {
          return typeof value === "boolean";
        };
        var isObject = function (value) {
          return typeof value === "object" && value !== null;
        };
        var isFunction = function (value) {
          return typeof value === "function";
        };
        var MOBILE = /Mobi/i.test(navigator.userAgent);

        var callbacks = {};
        var status = {};

        var random = function () {
          return parseInt(Math.random() * 10000) + new Date().valueOf();
        };

        // bind �썸빊polify, 訝띶를new�잒꺗�꼉ind

        var bind = function (target, context) {
          if (typeof target !== "function") {
            return;
          }
          var args = Array.prototype.slice.call(arguments, 2);

          if (Function.prototype.bind) {
            return target.bind(context, args);
          } else {
            return function () {
              var _args = Array.prototype.slice.call(arguments);
              return target.apply(context, args.concat(_args));
            };
          }
        };

        var toString = Object.prototype.toString;

        var _isFunction = function (obj) {
          return typeof obj === "function";
        };
        var _isObject = function (obj) {
          return obj === Object(obj);
        };
        var _isArray = function (obj) {
          return toString.call(obj) == "[object Array]";
        };
        var _isDate = function (obj) {
          return toString.call(obj) == "[object Date]";
        };
        var _isRegExp = function (obj) {
          return toString.call(obj) == "[object RegExp]";
        };
        var _isBoolean = function (obj) {
          return toString.call(obj) == "[object Boolean]";
        };

        function resolveKey(input) {
          return input.replace(
            /(\S)(_([a-zA-Z]))/g,
            function (match, $1, $2, $3) {
              return $1 + $3.toUpperCase() || "";
            }
          );
        }

        function camelizeKeys(input, convert) {
          if (
            !_isObject(input) ||
            _isDate(input) ||
            _isRegExp(input) ||
            _isBoolean(input) ||
            _isFunction(input)
          ) {
            return convert ? resolveKey(input) : input;
          }

          if (_isArray(input)) {
            var temp = [];
            for (var i = 0; i < input.length; i++) {
              temp.push(camelizeKeys(input[i]));
            }
          } else {
            var temp = {};
            for (var prop in input) {
              if (input.hasOwnProperty(prop)) {
                temp[camelizeKeys(prop, true)] = camelizeKeys(input[prop]);
              }
            }
          }
          return temp;
        }

        var loadScript = function (url, cb, timeout) {
          var script = document.createElement("script");
          script.charset = "UTF-8";
          script.async = true;

          // 野퉓eetest�꾦쓾�곮탡繹먩렌�� crossOrigin
          if (/static\.geetest\.com/g.test(url)) {
            script.crossOrigin = "anonymous";
          }

          script.onerror = function () {
            cb(true);
            // �숃�鰲�룕雅놅펽擁끾뿶�삭풌弱긴툖�ⓧ틙
            loaded = true;
          };
          var loaded = false;
          script.onload = script.onreadystatechange = function () {
            if (
              !loaded &&
              (!script.readyState ||
                "loaded" === script.readyState ||
                "complete" === script.readyState)
            ) {
              loaded = true;
              setTimeout(function () {
                cb(false);
              }, 0);
            }
          };
          script.src = url;
          head.appendChild(script);

          setTimeout(function () {
            if (!loaded) {
              script.onerror = script.onload = null;
              script.remove && script.remove();
              cb(true);
            }
          }, timeout || TIMEOUT);
        };

        var normalizeDomain = function (domain) {
          // special domain: uems.sysu.edu.cn/jwxt/geetest/
          // return domain.replace(/^https?:\/\/|\/.*$/g, ''); uems.sysu.edu.cn
          return domain.replace(/^https?:\/\/|\/$/g, ""); // uems.sysu.edu.cn/jwxt/geetest
        };
        var normalizePath = function (path) {
          path = path && path.replace(/\/+/g, "/");
          if (path.indexOf("/") !== 0) {
            path = "/" + path;
          }
          return path;
        };
        var normalizeQuery = function (query) {
          if (!query) {
            return "";
          }
          var q = "?";
          new _Object(query)._each(function (key, value) {
            if (isString(value) || isNumber(value) || isBoolean(value)) {
              q =
                q +
                encodeURIComponent(key) +
                "=" +
                encodeURIComponent(value) +
                "&";
            }
          });
          if (q === "?") {
            q = "";
          }
          return q.replace(/&$/, "");
        };
        var makeURL = function (protocol, domain, path, query) {
          domain = normalizeDomain(domain);

          var url = normalizePath(path) + normalizeQuery(query);
          if (domain) {
            url = protocol + domain + url;
          }

          return url;
        };

        var load = function (
          config,
          protocol,
          domains,
          path,
          query,
          cb,
          handleCb
        ) {
          var tryRequest = function (at) {
            // 鸚꾤릤jsonp�욆컘竊뚩퓳�뚥맏雅녵퓷瑥곫캀訝や툖�똨sonp�썸쐣����꾢썮瘟껃눦��
            if (handleCb) {
              var cbName = "geetest_" + random();
              // ��誤곦툗窯꾢뀍若싦퉱也폺bname�귝빊竊뚦닠�ㅵ�穩�
              window[cbName] = bind(handleCb, null, cbName);
              query.callback = cbName;
            }
            var url = makeURL(protocol, domains[at], path, query);
            loadScript(
              url,
              function (err) {
                if (err) {
                  // 擁끾뿶�뽬�끻눣�숂쉪�뜹�� 燁삯솮�욆컘
                  if (cbName) {
                    try {
                      window[cbName] = function () {
                        window[cbName] = null;
                      };
                    } catch (e) {}
                  }

                  if (at >= domains.length - 1) {
                    cb(true);
                    // report gettype error
                  } else {
                    tryRequest(at + 1);
                  }
                } else {
                  cb(false);
                }
              },
              config.timeout
            );
          };
          tryRequest(0);
        };

        var jsonp = function (domains, path, config, callback) {
          var handleCb = function (cbName, data) {
            // 岳앲칮�ゆ돢烏뚥�轝∽펽�③깿擁끾뿶�꾣깄�듕툔訝띴폏�띹㏄��;

            if (data.status == "success") {
              callback(data.data);
            } else if (!data.status) {
              callback(data);
            } else {
              //�ε룭�됭퓭�욑펽鵝녷삸瓦붷썮雅녽뵗瑥�듁�곻펽瓦쎾뀯�ι뵗�삭풌
              callback(data);
            }
            window[cbName] = undefined;
            try {
              delete window[cbName];
            } catch (e) {}
          };
          load(
            config,
            config.protocol,
            domains,
            path,
            {
              callback: "",
              captcha_id: config.captchaId,
              challenge: config.challenge || uuid(),
              client_type: config.clientType
                ? config.clientType
                : MOBILE
                ? "h5"
                : "web",
              risk_type: config.riskType,
              user_info: config.userInfo,
              call_type: config.callType,
              lang: config.language
                ? config.language
                : navigator.appName === "Netscape"
                ? navigator.language.toLowerCase()
                : navigator.userLanguage.toLowerCase(),
            },
            function (err) {
              // 營묊퍥��쥦�ε룭亦→쐣瓦붷썮竊뚨쎍�δ슴�ⓩ쑍�곈챿瑥곭쟻竊뚩뎔若뺞쑛與▼폀
              // 瓦숅뇤��빳曆삣뒥�ⓩ댎�꾦�삭풌
              if (err && typeof config.offlineCb === "function") {
                // �㎬죱�ゅ런�꾢츜��
                config.offlineCb();
                return;
              }
              if (err) {
                callback(config._get_fallback_config());
              }
            },
            handleCb
          );
        };

        var reportError = function (config, url) {
          load(
            config,
            config.protocol,
            ["monitor.geetest.com"],
            "/monitor/send",
            {
              time: Date.now().getTime(),
              captcha_id: config.gt,
              challenge: config.challenge,
              exception_url: url,
              error_code: config.error_code,
            },
            function (err) {}
          );
        };

        var throwError = function (errorType, config, errObj) {
          var errors = {
            networkError: "營묊퍥�숃�",
            gtTypeError: "gt耶쀦�訝띷삸耶쀧Е訝꿰굳��",
          };
          if (typeof config.onError === "function") {
            config.onError({
              desc: errObj.desc,
              msg: errObj.msg,
              code: errObj.code,
            });
          } else {
            throw new Error(errors[errorType]);
          }
        };

        var detect = function () {
          return window.Geetest || document.getElementById("gt_lib");
        };

        if (detect()) {
          status.slide = "loaded";
        }
        var GeetestIsLoad = function (fname) {
          var GeetestIsLoad = false;
          var tags = { js: "script", css: "link" };
          var tagname = fname && tags[fname.split(".").pop()];
          if (tagname !== undefined) {
            var elts = document.getElementsByTagName(tagname);
            for (var i in elts) {
              if (
                (elts[i].href && elts[i].href.toString().indexOf(fname) > 0) ||
                (elts[i].src && elts[i].src.toString().indexOf(fname) > 0)
              ) {
                GeetestIsLoad = true;
              }
            }
          }
          return GeetestIsLoad;
        };
        window.initGeetest4 = function (userConfig, callback) {
          var config = new Config(userConfig);
          if (userConfig.https) {
            config.protocol = "https://";
          } else if (!userConfig.protocol) {
            config.protocol = window.location.protocol + "//";
          }

          if (isObject(userConfig.getType)) {
            config._extend(userConfig.getType);
          }

          jsonp(
            config.apiServers,
            config.typePath,
            config,
            function (newConfig) {
              //�숃��뺠렩竊뚨К訝�訝챟oad瑥룡콆��꺗�닸렏�ι뵗
              var newConfig = camelizeKeys(newConfig);

              if (newConfig.status === "error") {
                return throwError("networkError", config, newConfig);
              }

              var type = newConfig.type;
              if (config.debug) {
                new _Object(newConfig)._extend(config.debug);
              }
              var init = function () {
                config._extend(newConfig);
                callback(new window.Geetest4(config));
              };

              callbacks[type] = callbacks[type] || [];

              var s = status[type] || "init";
              if (s === "init") {
                status[type] = "loading";

                callbacks[type].push(init);

                if (newConfig.gctPath) {
                  load(
                    config,
                    config.protocol,
                    Object.hasOwnProperty.call(config, "staticServers")
                      ? config.staticServers
                      : newConfig.staticServers || config.staticServers,
                    newConfig.gctPath,
                    null,
                    function (err) {
                      if (err) {
                        throwError("networkError", config, {
                          code: "60205",
                          msg: "Network failure",
                          desc: {
                            detail: "gct resource load timeout",
                          },
                        });
                      }
                    }
                  );
                }

                load(
                  config,
                  config.protocol,
                  Object.hasOwnProperty.call(config, "staticServers")
                    ? config.staticServers
                    : newConfig.staticServers || config.staticServers,
                  newConfig.bypass || newConfig.staticPath + newConfig.js,
                  null,
                  function (err) {
                    if (err) {
                      status[type] = "fail";
                      throwError("networkError", config, {
                        code: "60204",
                        msg: "Network failure",
                        desc: {
                          detail: "js resource load timeout",
                        },
                      });
                    } else {
                      status[type] = "loaded";
                      var cbs = callbacks[type];
                      for (var i = 0, len = cbs.length; i < len; i = i + 1) {
                        var cb = cbs[i];
                        if (isFunction(cb)) {
                          cb();
                        }
                      }
                      callbacks[type] = [];
                      status[type] = "init";
                    }
                  }
                );
              } else if (s === "loaded") {
                // �ㅶ뼪gct��맔��誤곲뇥�겼뒥饔�
                if (newConfig.gctPath && !GeetestIsLoad(newConfig.gctPath)) {
                  load(
                    config,
                    config.protocol,
                    Object.hasOwnProperty.call(config, "staticServers")
                      ? config.staticServers
                      : newConfig.staticServers || config.staticServers,
                    newConfig.gctPath,
                    null,
                    function (err) {
                      if (err) {
                        throwError("networkError", config, {
                          code: "60205",
                          msg: "Network failure",
                          desc: {
                            detail: "gct resource load timeout",
                          },
                        });
                      }
                    }
                  );
                }
                return init();
              } else if (s === "fail") {
                throwError("networkError", config, {
                  code: "60204",
                  msg: "Network failure",
                  desc: {
                    detail: "js resource load timeout",
                  },
                });
              } else if (s === "loading") {
                callbacks[type].push(init);
              }
            }
          );
        };
      })(window);
    </script>

    <script>
      (function () {
        //geeToken兼容ai下无token
        if (!isOffline) {
          // 非宕机模式下获取移动端coreSDK数据
          jsBridge.callNative({
            type: "get",
          });
        }
        var startTime = 0;
        var clearID = 0;
        var captcha = document.getElementById("captcha");
        // var loadingEle = document.getElementById('geetest_index_loading');
        // var img = document.getElementById('geetest_img_loading');

        var query = location.href.split("?")[1];
        // 兼容安卓4.3版本样式问题
        // var ua = navigator.userAgent.toLowerCase();
        // if(/Android/.test(window.navigator.userAgent) && /android\s([\w.]+)/.exec(ua)[1] <= 4.3) {
        //     loadingEle.style.left = '45%';
        // }

        // 兼容低版本Object.assign
        if (typeof Object.assign != "function") {
          // Must be writable: true, enumerable: false, configurable: true
          Object.defineProperty(Object, "assign", {
            value: function assign(target, varArgs) {
              // .length of function is 2
              if (target == null) {
                // TypeError if undefined or null
                throw new TypeError(
                  "Cannot convert undefined or null to object"
                );
              }

              var to = Object(target);

              for (var index = 1; index < arguments.length; index++) {
                var nextSource = arguments[index];

                if (nextSource != null) {
                  // Skip over if undefined or null
                  for (var nextKey in nextSource) {
                    // Avoid bugs when hasOwnProperty is shadowed
                    if (
                      Object.prototype.hasOwnProperty.call(nextSource, nextKey)
                    ) {
                      to[nextKey] = nextSource[nextKey];
                    }
                  }
                }
              }
              return to;
            },
            writable: true,
            configurable: true,
          });
        }
        // 默认配置
        var config = {
          product: "bind",
          onError: function (e) {
            // 错误信息中插入版本号
            e.desc = Object.assign({}, e.desc, { indexVersion: indexVersion });
            jsBridge.callNative({
              type: "error",
              data: e,
            });
          },
        };
        function setDebug() {
          debug = true;
          logEle.className = "log";
        }

        function paseURI() {
          return JSON.parse(decodeURIComponent(query.split("=")[1]));
        }

        function checkArgs(args) {
          //设置loading
          // img.src = args['loading'] ? args['loading'] : './gt4-loading.gif';

          // clearID = setTimeout(function () {
          //     img.style.display = 'inline-block';
          // }, 200);

          // 是否开启debug
          if (args["debug"]) {
            setDebug(true);
            startTime = new Date().getTime();
            log(JSON.stringify(args));
          }

          // 设置title
          if (args["title"] && args["title"] != "") {
            var h3 = document.createElement("h3");
            h3.className = "title";
            h3.appendChild(
              document.createTextNode(decodeURIComponent(args["title"]))
            );
            captcha.appendChild(h3);
          }

          // 检查必要参数
          if (!args["captchaId"]) {
            log("args error: " + query);
          }

          // 通过useLocalOffline判断是否会加入宕机效验
          if (args["useLocalOffline"]) {
            //宕机启用自己的方法
            config.offlineCb = function () {
              isOffline = true;

              jsBridge.callNative({
                type: "result",
                data: {
                  captcha_id: args["captchaId"],
                  challenge: args["challenge"],
                  offline: true,
                },
              });
            };
          }
        }

        function mergeOptions(args) {
          for (var k in args) {
            if (
              args.hasOwnProperty(k) &&
              ["debug", "title", args["type"]].indexOf(k) === -1
            ) {
              config[k] = args[k];
            }
          }
        }

        if (!query) {
          setDebug();
          log("no query: " + location.href);
          return false;
        }

        // 解析参数
        var args = paseURI(query);

        // 检查参数
        checkArgs(args);

        // 合并配置项
        mergeOptions(args);

        // 初始化验证码
        var handler = function (captchaObj) {
          window.captchaObj = captchaObj;
          captchaObj
            .appendTo(captcha)
            .onSuccess(function () {
              var result = captchaObj.getValidate();
              log("Success validate: " + result);
              jsBridge.callNative({
                type: "result",
                data: result,
              });
            })
            .onReady(function () {
              log("load time: " + (new Date().getTime() - (startTime || 0)));

              jsBridge.callNative({
                type: "ready",
                data: {
                  ready: 0,
                },
              });

              clearTimeout(clearID);
              // loadingEle.style.display = 'none';
            })
            .onClose(function () {
              jsBridge.callNative({
                type: "close",
              });
            })
            .onError(function (e) {
              e.desc && (e.desc.indexVersion = indexVersion);
              jsBridge.callNative({
                type: "error",
                data: e,
              });
            })
            .onFail(function (e) {
              jsBridge.callNative({
                type: "fail",
                data: e,
              });
            });
        };
        window.initGeetest4(config, handler);
      })();
    </script>
  </body>
</html>
